name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0' }
      - run: npm install -g pnpm@11.19.0
      - run: pnpm run bootstrap
      - run: test -z "$(gofmt -l backend/cmd backend/internal backend/migrations)"
      - run: pnpm --dir backend test:integration
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: node scripts/check-contract.mjs
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/init-env.mjs
      - run: docker compose --env-file .env -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file .env -f deploy/compose.yaml build
      - run: docker compose --env-file .env -f deploy/compose.yaml up -d --no-build --wait --wait-timeout 180 postgres migrate api worker capture capture-egress keycloak qdrant mailpit nginx
      - run: docker compose --env-file .env -f deploy/compose.yaml exec -T capture node capture/dist/browser-smoke.js
      - run: node scripts/smoke-compose.mjs
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down
