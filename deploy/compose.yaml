name: saveboard

x-backend: &backend
  image: saveboard/backend:dev
  build:
    context: ../backend
    dockerfile: Dockerfile
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &backend-env
    DATABASE_URL: postgres://saveboard:${APP_DB_PASSWORD:?Run node scripts/init-env.mjs}@postgres:5432/saveboard?sslmode=disable
    HTTP_ADDR: :8080

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run node scripts/init-env.mjs}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run node scripts/init-env.mjs}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run node scripts/init-env.mjs}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [/app/migrate]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *backend
    command: [/app/api]
    networks: [edge, data]
    read_only: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *backend
    command: [/app/worker]
    environment:
      <<: *backend-env
      CAPTURE_URL: http://capture:3001
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:?Run node scripts/init-env.mjs}
      QDRANT_HOST: qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Run node scripts/init-env.mjs}
      OLLAMA_URL: http://ollama:11434
      BLOB_ROOT: /data/blobs
    volumes: [blobs:/data]
    networks: [data, capture-control]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
    restart: unless-stopped

  capture:
    image: saveboard/capture:dev
    build:
      context: ../backend
      dockerfile: capture/Dockerfile
    environment:
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:?Run node scripts/init-env.mjs}
    networks: [capture-control]
    init: true
    read_only: true
    tmpfs: [/tmp:size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run node scripts/init-env.mjs}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run node scripts/init-env.mjs}
      KC_HOSTNAME: http://localhost:${HTTP_PORT:-8080}/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      HTTP_PORT: ${HTTP_PORT:-8080}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run node scripts/init-env.mjs}
    volumes: [./keycloak/saveboard-realm.json:/opt/keycloak/data/import/saveboard-realm.json:ro]
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /identity/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run node scripts/init-env.mjs}
    volumes: [qdrant:/qdrant/storage]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\napi-key: %s\\r\\n\\r\\n\" \"$$QDRANT__SERVICE__API_KEY\" >&3; grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.0@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687
    environment: { OLLAMA_HOST: '0.0.0.0:11434' }
    volumes: [ollama:/root/.ollama]
    networks: [data, model-download]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  model-init:
    image: node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    profiles: [embeddings]
    command: [node, /workspace/scripts/init-model.mjs]
    environment: { OLLAMA_URL: 'http://ollama:11434' }
    volumes:
      - ../backend/scripts/init-model.mjs:/workspace/scripts/init-model.mjs:ro
      - ../backend/scripts/model-digest.mjs:/workspace/scripts/model-digest.mjs:ro
      - ../backend/config/embedding-model.json:/workspace/config/embedding-model.json:ro
    networks: [data, model-download]
    depends_on:
      ollama: { condition: service_healthy }
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    networks: [data]
    restart: unless-stopped

  nginx:
    image: saveboard/web:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:80']
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres:
  blobs:
  qdrant:
  ollama:

networks:
  edge:
  data: { internal: true }
  capture-control: { internal: true }
  model-download:
